name: Observatorio Winners

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  observar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas requests

      - name: Health Check
        run: python src/health_check.py

      - name: Generación Prospectiva (Pipeline)
        run: python src/prospective_pipeline.py

      - name: Liquidación Prospectiva (Settler)
        run: python src/prospective_settler.py

      - name: Actualizar Diario Acumulativo
        run: python src/prospective_journal.py

      - name: Actualizar Dashboard JSON
        run: python src/dashboard.py

      - name: Generar HTML Estático
        run: python src/generate_html.py

      - name: Auditoría de Evidencia
        run: python src/evidence_audit.py

      - name: Commit y Push de Cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prospective/ data/source_snapshots/ docs/
          git commit -m "chore: recolección de evidencia prospectiva [skip ci]" || echo "No hay cambios para commitear"
          git push
